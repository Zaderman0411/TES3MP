version: "{build}"

branches:
    only:
        - master
        - /openmw-.*$/
        - appveyor

environment:
    matrix:
        - msvc: 2019
          APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2019
          RAKNET_ROOT: C:\projects\openmw\deps\RakNet

platform:
#   - Win32
    - x64

configuration:
#    - Debug
    - Release
#    - RelWithDebInfo

# For the Qt, Boost, CMake, etc installs
#os: Visual Studio 2017

# We want the git revision for versioning,
# so shallow clones don't work.
clone_depth: 1

cache:
    - C:\projects\openmw\deps\Bullet-2.87-msvc2015-win32.7z
    - C:\projects\openmw\deps\Bullet-2.87-msvc2015-win64.7z
    - C:\projects\openmw\deps\MyGUI-3.2.2-msvc2015-win32.7z
    - C:\projects\openmw\deps\MyGUI-3.2.2-msvc2015-win64.7z
    - C:\projects\openmw\deps\OSG-3.4.1-scrawl-msvc2015-win32.7z
    - C:\projects\openmw\deps\OSG-3.4.1-scrawl-msvc2015-win64.7z
    - C:\projects\openmw\deps\ffmpeg-3.2.4-dev-win32.zip
    - C:\projects\openmw\deps\ffmpeg-3.2.4-dev-win64.zip
    - C:\projects\openmw\deps\ffmpeg-3.2.4-win32.zip
    - C:\projects\openmw\deps\ffmpeg-3.2.4-win64.zip
    - C:\projects\openmw\deps\OpenAL-Soft-1.19.1.zip
    - C:\projects\openmw\deps\SDL2-2.0.7.zip

clone_folder: C:\projects\openmw

install:
    - set PATH=C:\Program Files\Git\mingw64\bin;%PATH%
    - ps: Invoke-WebRequest -Uri 'https://github.com/Kitware/CMake/releases/download/v3.31.12/cmake-3.31.12-windows-x86_64.zip' -OutFile 'C:\cmake-3.31.12.zip'
    - ps: Expand-Archive -Path 'C:\cmake-3.31.12.zip' -DestinationPath 'C:\cmake-3.31.12'
    - set PATH=C:\cmake-3.31.12\cmake-3.31.12-windows-x86_64\bin;%PATH%
    - cmd: cmake --version
    - cmd: python -m pip install --disable-pip-version-check aqtinstall
    - cmd: python -m aqt install-qt -O C:\Qt windows desktop 5.15.2 win64_msvc2019_64 --archives qtbase
    # The modified TES3MP prebuild uses the local Boost-install path, so place
    # the exact historical Boost 1.71 installer where that script expects it.
    - ps: New-Item -ItemType Directory -Force 'C:\projects\openmw\deps' | Out-Null
    - ps: Invoke-WebRequest -Uri 'https://gitlab.com/OpenMW/openmw-deps/-/raw/main/windows/boost_1_71_0-msvc-14.2-64.exe' -OutFile 'C:\projects\openmw\deps\boost-1.71.0-msvc14.2-win64.exe'
    - cmd: dir C:\projects\openmw\deps\boost-1.71.0-msvc14.2-win64.exe
    # TES3MP 0.8.1 requires TES3MP/CrabNet rather than upstream RakNet.
    - cmd: git clone --depth 1 https://github.com/TES3MP/CrabNet.git deps\CrabNet-src
    - cmd: cmake -S deps\CrabNet-src -B deps\CrabNet-build -G "Visual Studio 16 2019" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCRABNET_ENABLE_DLL=OFF -DCRABNET_ENABLE_SAMPLES=OFF -DCRABNET_ENABLE_STATIC=ON -DCRABNET_ENABLE_LIBCAT_SECURITY=OFF -DCMAKE_INSTALL_PREFIX=%RAKNET_ROOT%
    - cmd: cmake --build deps\CrabNet-build --target RakNetLibStatic --config Release --parallel 2
    - cmd: cmake --install deps\CrabNet-build --config Release
    - cmd: cmake --build deps\CrabNet-build --target RakNetLibStatic --config Debug --parallel 2
    - cmd: cmake --install deps\CrabNet-build --config Debug
    - cmd: dir %RAKNET_ROOT%\lib
    - cmd: dir %RAKNET_ROOT%\include\raknet

before_build:
    - cmd: git submodule update --init --recursive
    - cmd: sh %APPVEYOR_BUILD_FOLDER%\CI\before_script.msvc.sh -c %configuration% -p %PLATFORM% -v %msvc% -V -i %APPVEYOR_BUILD_FOLDER%\install

build_script:
    - cmd: if %PLATFORM%==Win32 set build=MSVC%msvc%_32
    - cmd: if %PLATFORM%==x64 set build=MSVC%msvc%_64
    - cmd: msbuild %build%\OpenMW.sln /t:Build /p:Configuration=%configuration% /m:2 /logger:"C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll"
    - cmd: cmake --install %build% --config %configuration%

after_build:
    - cmd: if %PLATFORM%==x64 7z a OpenMW_MSVC%msvc%_%platform%_%appveyor_pull_request_number%_%appveyor_pull_request_head_commit%.zip %APPVEYOR_BUILD_FOLDER%\install -xr"!*.pdb"
    #- cmd: if %PLATFORM%==x64 7z a OpenMW_MSVC%msvc%_%platform%_%appveyor_pull_request_number%_%appveyor_pull_request_head_commit%_pdb.zip %APPVEYOR_BUILD_FOLDER%\MSVC%msvc%_64\%configuration%\*.pdb

test: off

#notifications:
#    - provider: Email
#    to:
#        -
#    on_build_failure: true
#    on_build_status_changed: true

artifacts:
  - path: OpenMW_MSVC%msvc%_%platform%_%appveyor_pull_request_number%_%appveyor_pull_request_head_commit%.zip
    name: OpenMW_MSVC%msvc%_%platform%_%appveyor_pull_request_number%_%appveyor_pull_request_head_commit%
  #- path: OpenMW_MSVC%msvc%_%platform%_%appveyor_pull_request_number%_%appveyor_pull_request_head_commit%_pdb.zip
  #  name: OpenMW_MSVC%msvc%_%platform%_%appveyor_pull_request_number%_%appveyor_pull_request_head_commit%_pdb
